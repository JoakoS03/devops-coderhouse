apiVersion: v1
kind: Service
metadata:
  name: todo-api-service
  namespace: todo-app
  labels:
    app: todo-api
spec:
  type: ClusterIP
  selector:
    app: todo-api
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP

