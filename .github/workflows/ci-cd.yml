name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  IMAGE_NAME: todo-api
  REGISTRY: ghcr.io

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: app/requirements.txt
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          
      - name: Run tests with pytest
        run: |
          cd app && pytest -v test_main.py

  sast:
    name: Security - Static Analysis (SAST)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install Bandit
        run: pip install bandit
        
      - name: Run Bandit SAST
        run: bandit -r app/ -f json -o bandit-report.json || true
        
      - name: Upload Bandit Report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true

  build-and-push:
    name: Build and Push Docker Image
    needs: sast
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name to lowercase
        id: image_name
        run: echo "IMAGE=${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]' >> $GITHUB_OUTPUT

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image_name.outputs.IMAGE }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
            
      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ steps.image_name.outputs.IMAGE }}:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true

  terraform-validate:
    name: Terraform Validate
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        
      - name: Terraform Init
        run: terraform init -backend=false
        working-directory: ./terraform
        
      - name: Terraform Validate
        run: terraform validate
        working-directory: ./terraform

  deploy:
    name: Deploy to Kubernetes
    needs: terraform-validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Create KinD cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: todo-api-test

      - name: Build Docker image for testing
        run: docker build -t todo-api:v2 ./app
        
      - name: Load image into KinD
        run: kind load docker-image todo-api:v2 --name todo-api-test

      - name: Apply Kubernetes Manifests
        run: |
          kubectl apply -f k8s/
          
      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/todo-api -n todo-app --timeout=120s
          
      - name: Verify Deployment
        run: |
          kubectl get pods -n todo-app
          kubectl get services -n todo-app

  dast:
    name: Security - Dynamic Analysis (DAST)
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create KinD cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: todo-api-dast

      - name: Build Docker image for DAST
        run: docker build -t todo-api:v2 ./app
        
      - name: Load image into KinD
        run: kind load docker-image todo-api:v2 --name todo-api-dast

      - name: Deploy app for DAST
        run: |
          kubectl apply -f k8s/
          kubectl rollout status deployment/todo-api -n todo-app --timeout=120s

      - name: Port forward and run ZAP
        run: |
          kubectl port-forward -n todo-app svc/todo-api-service 8000:8000 &
          sleep 5

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:8000'
          cmd_options: '-a -j'
          allow_issue_writing: false
          
      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: report_html.html
